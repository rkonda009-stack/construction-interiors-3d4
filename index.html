<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORM — Construction & Interiors</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@300;400;500&display=swap');

* {
  <a href="https://wa.me/91YOURNUMBER" class="contact-btn">
  Contact
</a>
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #11100e;
  color: #fff;
  font-family: Inter, Arial, sans-serif;
}

button,
a {
  font: inherit;
}

.experience {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 540px;
  overflow: hidden;
  background: #11100e;
}

/* =========================================================
   BACKGROUNDS
========================================================= */

.backgrounds,
.background {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.background {
  object-fit: cover;
  opacity: 0;
  transition: opacity .9s ease;
  filter: brightness(.72);
}

.background.is-visible {
  opacity: 1;
}

.shade {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.08) 20%,
      rgba(0,0,0,.35) 55%,
      rgba(0,0,0,.94) 100%
    );
}

/* =========================================================
   PRELOADER
========================================================= */

.preloader {
  position: absolute;
  inset: 0;
  z-index: 30;
  background: #0d0c0a;
  overflow: hidden;
}

.preloader img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(.72);
  transform: scale(1.08);
  animation: preloaderZoom 4s ease forwards;
}

.preloader-shade {
  position: absolute;
  inset: auto 0 0;
  height: 45%;
  background: linear-gradient(
    to bottom,
    transparent,
    #0d0c0a
  );
}

.preloader.is-background {
  z-index: 0;
}

.preloader.is-background .preloader-shade {
  opacity: 0;
}

@keyframes preloaderZoom {
  from {
    transform: scale(1.08);
  }
  to {
    transform: scale(1);
  }
}

.floating-logo {
  position: fixed;
  z-index: 35;
  left: 50%;
  top: 50%;
  width: 74px;
  height: 74px;
  transform: translate(-50%, -50%);
  display: grid;
  place-items: center;
  border: 1px solid rgba(255,255,255,.7);
  border-radius: 50%;
  font-size: 18px;
  letter-spacing: .12em;
  font-weight: 500;
  transition:
    left 1.8s cubic-bezier(.16,1,.3,1),
    top 1.8s cubic-bezier(.16,1,.3,1),
    width 1.8s cubic-bezier(.16,1,.3,1),
    height 1.8s cubic-bezier(.16,1,.3,1),
    transform 1.8s cubic-bezier(.16,1,.3,1);
}

.floating-logo.is-docked {
  left: 28px;
  top: 27px;
  width: 42px;
  height: 42px;
  transform: none;
  font-size: 11px;
}

.floating-logo.is-settled {
  z-index: 5;
}

.preloader-count {
  position: fixed;
  z-index: 36;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%);
  display: flex;
  align-items: flex-end;
  gap: 4px;
  line-height: 1;
}

.preloader-count span:first-child {
  font-size: 62px;
  font-weight: 300;
  letter-spacing: -.06em;
}

.preloader-count .percent {
  font-size: 22px;
  padding-bottom: 6px;
}

.preloader-count.is-leaving {
  animation: countOut .75s cubic-bezier(.22,1,.36,1) both;
}

@keyframes countOut {
  to {
    opacity: 0;
    filter: blur(8px);
    transform: translate(-50%, -35px);
  }
}

/* =========================================================
   CHROME
========================================================= */

.chrome {
  position: absolute;
  z-index: 8;
  transition:
    opacity .45s ease,
    filter .45s ease;
}

.experience.is-transitioning .chrome {
  opacity: 0;
  filter: blur(8px);
  pointer-events: none;
}

/* =========================================================
   HEADER
========================================================= */

.header {
  left: 28px;
  right: 28px;
  top: 26px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  opacity: 0;
  letter-spacing: .16em;
  font-size: 12px;
  font-weight: 600;
}

.header-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}

.nav {
  display: flex;
  align-items: center;
  height: 42px;
  padding: 4px 5px;
  border: 1px solid rgba(255,255,255,.42);
  background: rgba(255,255,255,.1);
  backdrop-filter: blur(14px);
  border-radius: 999px;
}

.nav a {
  color: #fff;
  text-decoration: none;
  padding: 8px 18px;
  border-radius: 999px;
  font-size: 13px;
}

.nav a.active {
  background: #fff;
  color: #111;
}

.menu {
  height: 42px;
  padding: 0 20px;
  border: 0;
  border-radius: 999px;
  background: #fff;
  color: #111;
  cursor: pointer;
}

/* =========================================================
   PROJECT LIST
========================================================= */

.project-list {
  left: 28px;
  top: 50%;
  transform: translateY(-43%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 14px;
  letter-spacing: .01em;
}

.project-item {
  display: flex;
  align-items: center;
  min-height: 20px;
  opacity: .65;
}

.project-item.active {
  font-size: 16px;
  font-weight: 600;
  gap: 8px;
  opacity: 1;
}

.project-item.active::before {
  content: "";
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
}

/* =========================================================
   PORTAL
========================================================= */

.portal-wrap {
  left: 50%;
  top: 50%;
  width: min(330px, 31vw);
  transform: translate(-50%, -54%);
  z-index: 7;
}

.portal-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  font-size: 13px;
  letter-spacing: .04em;
  opacity: 0;
}

.portal-heading strong {
  font-size: 16px;
  margin-left: 8px;
}

.portal {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 320 / 350;
  padding: 0;
  overflow: visible;
  border: 0;
  border-radius: 90px;
  background: transparent;
  cursor: none;
}

.portal-media {
  visibility: hidden;
  position: absolute;
  width: 1px;
  height: 1px;
  pointer-events: none;
}

.portal-canvas {
  position: fixed;
  inset: 0;
  z-index: 6;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* =========================================================
   CONTENT
========================================================= */

.project-content {
  left: clamp(28px, 4vw, 58px);
  right: clamp(28px, 3vw, 44px);
  bottom: clamp(24px, 3vh, 30px);
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 40px;
}

.project-content h1 {
  font-family: Oswald, Arial Narrow, sans-serif;
  font-size: clamp(105px, 20vw, 285px);
  font-weight: 300;
  line-height: .72;
  margin: 0 0 -.04em;
  letter-spacing: -.025em;
  transform: translateX(-25px);
  opacity: 0;
}

.project-content dl {
  width: min(470px, 35vw);
  margin: 0;
  font-size: 14px;
}

.fact {
  display: grid;
  grid-template-columns: 135px 1fr;
  gap: 18px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,.42);
  opacity: 0;
}

.fact:last-child {
  border-bottom: 0;
}

.fact dt {
  font-weight: 600;
}

.fact dd {
  margin: 0;
  opacity: .85;
}

/* =========================================================
   LOADING
========================================================= */

.loading {
  position: absolute;
  z-index: 12;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%);
  opacity: 0;
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
}

.experience.is-loading .loading {
  opacity: .8;
}

/* =========================================================
   ENTRANCE ANIMATIONS
========================================================= */

body:not(.intro-ready) .header,
body:not(.intro-ready) .project-list,
body:not(.intro-ready) .project-content h1,
body:not(.intro-ready) .project-content .fact {
  opacity: 0;
}

.intro-ready .brand {
  animation: fadeBrand .8s ease .2s forwards;
}

.intro-ready .header {
  animation: revealDown .9s cubic-bezier(.22,1,.36,1) .1s both;
}

.intro-ready .project-list {
  animation: revealSide .9s cubic-bezier(.22,1,.36,1) .55s both;
}

.content-revealing h1 {
  animation: titleRise 1.05s cubic-bezier(.16,1,.3,1) both;
}

.content-revealing .fact {
  animation: factRise .72s cubic-bezier(.22,1,.36,1) both;
}

.content-revealing .fact:nth-child(1) {
  animation-delay: .52s;
}

.content-revealing .fact:nth-child(2) {
  animation-delay: .68s;
}

.content-revealing .fact:nth-child(3) {
  animation-delay: .84s;
}

.content-revealing .fact:nth-child(4) {
  animation-delay: 1s;
}

.mask-revealing .portal-heading {
  animation: portalCaption .85s cubic-bezier(.22,1,.36,1) both;
}

.project-list.is-switching .project-item {
  animation: menuRow .58s cubic-bezier(.22,1,.36,1) both;
}

@keyframes fadeBrand {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes revealDown {
  from {
    opacity: 0;
    filter: blur(8px);
    transform: translateY(-18px);
  }
  to {
    opacity: 1;
    filter: blur(0);
    transform: translateY(0);
  }
}

@keyframes revealSide {
  from {
    opacity: 0;
    filter: blur(8px);
    transform: translate(-20px,-43%);
  }
  to {
    opacity: 1;
    filter: blur(0);
    transform: translate(0,-43%);
  }
}

@keyframes titleRise {
  from {
    opacity: 0;
    filter: blur(12px);
    transform: translate(-25px,42px);
  }
  to {
    opacity: 1;
    filter: blur(0);
    transform: translate(-25px,0);
  }
}

@keyframes factRise {
  from {
    opacity: 0;
    filter: blur(7px);
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    filter: blur(0);
    transform: translateY(0);
  }
}

@keyframes portalCaption {
  from {
    opacity: 0;
    filter: blur(7px);
    transform: translateY(22px);
  }
  to {
    opacity: 1;
    filter: blur(0);
    transform: translateY(0);
  }
}

@keyframes menuRow {
  from {
    opacity: .35;
    transform: translateX(-8px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

/* =========================================================
   CUSTOM CURSOR
========================================================= */

html,
body,
button,
a,
.portal {
  cursor: none !important;
}

.custom-cursor {
  display: block;
  position: fixed;
  left: 0;
  top: 0;
  z-index: 100;
  width: 1px;
  height: 1px;
  pointer-events: none;
  opacity: 0;
  transition: opacity .2s ease;
}

.custom-cursor.is-visible {
  opacity: 1;
}

.cursor-dot,
.cursor-orbit {
  position: absolute;
  left: 0;
  top: 0;
  border-radius: 50%;
  transform: translate(-50%,-50%);
}

.cursor-dot {
  width: 10px;
  height: 10px;
  background: #fff;
}

.cursor-orbit {
  width: 36px;
  height: 36px;
  border: 1px solid #fff;
  background: rgba(255,255,255,.2);
  transition:
    transform .3s cubic-bezier(.22,1,.36,1);
}

.custom-cursor.is-enter .cursor-orbit {
  transform: translate(-50%,-50%) scale(1.16);
}

.cursor-label {
  position: absolute;
  top: 26px;
  left: 0;
  transform: translateX(-50%) translateY(-4px);
  font-size: 13px;
  white-space: nowrap;
  opacity: 0;
  transition:
    opacity .2s ease,
    transform .3s cubic-bezier(.22,1,.36,1);
}

.custom-cursor.is-enter .cursor-label {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {

  .nav {
    display: none;
  }

  .portal-wrap {
    width: min(300px,48vw);
  }

  .project-content h1 {
    font-size: clamp(100px,24vw,190px);
  }

  .project-content dl {
    width: 43vw;
  }

  .fact {
    grid-template-columns: 105px 1fr;
  }

  .project-list {
    font-size: 13px;
  }
}

@media (max-width: 640px) {

  .experience {
    min-height: 600px;
  }

  .header {
    left: 18px;
    right: 18px;
    top: 18px;
  }

  .brand {
    font-size: 10px;
  }

  .project-list {
    display: none;
  }

  .portal-wrap {
    top: 43%;
    width: min(260px,66vw);
  }

  .project-content {
    left: 18px;
    right: 18px;
    bottom: 18px;
    display: block;
  }

  .project-content h1 {
    font-size: clamp(82px,29vw,155px);
    margin-bottom: 20px;
  }

  .project-content dl {
    width: 100%;
    font-size: 12px;
  }

  .fact {
    grid-template-columns: 88px 1fr;
    padding: 5px 0;
  }

  .portal-heading {
    font-size: 12px;
  }

  .portal-heading strong {
    font-size: 14px;
  }

  .menu {
    height: 38px;
    padding: 0 17px;
  }

  .floating-logo.is-docked {
    left: 18px;
    top: 18px;
  }
}

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

/* =========================================================

========================================================= */

/* =========================================================

========================================================= */

/* =========================================================
   CANVAS RESIZE
========================================================= */

function resizeCanvas() {

  const d =
    Math.min(window.devicePixelRatio || 1, 2);

  portalCanvas.width =
    window.innerWidth * d;

  portalCanvas.height =
    window.innerHeight * d;

  portalCanvas.style.width =
    window.innerWidth + "px";

  portalCanvas.style.height =
    window.innerHeight + "px";

  ctx.setTransform(
    d,
    0,
    0,
    d,
    0,
    0
  );
}


/* =========================================================
   DRAW COVER
========================================================= */

function drawCover(media) {

  if (!media) return;

  const mw =
    media.naturalWidth ||
    media.videoWidth ||
    media.width;

  const mh =
    media.naturalHeight ||
    media.videoHeight ||
    media.height;

  if (!mw || !mh) return;

  const scale =
    Math.max(
      window.innerWidth / mw,
      window.innerHeight / mh
    );

  const w =
    mw * scale;

  const h =
    mh * scale;

  const x =
    (window.innerWidth - w) / 2;

  const y =
    (window.innerHeight - h) / 2;

  ctx.drawImage(
    media,
    x,
    y,
    w,
    h
  );
}


/* =========================================================
   ROUNDED RECTANGLE POINTS
========================================================= */

function roundedRectPoints(
  w,
  h,
  r
) {

  r =
    Math.min(
      r,
      w / 2,
      h / 2
    );

  const points = [];

  const corners = [

    [
      w / 2 - r,
      -h / 2 + r,
      -Math.PI / 2,
      0
    ],

    [
      w / 2 - r,
      h / 2 - r,
      0,
      Math.PI / 2
    ],

    [
      -w / 2 + r,
      h / 2 - r,
      Math.PI / 2,
      Math.PI
    ],

    [
      -w / 2 + r,
      -h / 2 + r,
      Math.PI,
      Math.PI * 1.5
    ]

  ];

  corners.forEach(c => {

    for (let i = 0; i <= 10; i++) {

      const t = i / 10;

      const angle =
        c[2] +
        (c[3] - c[2]) * t;

      points.push({

        x:
          c[0] +
          r * Math.cos(angle),

        y:
          c[1] +
          r * Math.sin(angle)

      });

    }

  });

  return points;
}


/* =========================================================
   DRAW SHADE
========================================================= */

function drawShade() {

  const gradient =
    ctx.createLinearGradient(
      0,
      window.innerHeight * .52,
      0,
      window.innerHeight
    );

  gradient.addColorStop(
    0,
    "rgba(0,0,0,0)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,.88)"
  );

  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,
    window.innerHeight * .52,
    window.innerWidth,
    window.innerHeight * .48
  );
}


/* =========================================================
   EASING
========================================================= */

function easeInOutCubic(t) {

  return t < .5

    ? 4 * t * t * t

    : 1 -
      Math.pow(
        -2 * t + 2,
        3
      ) / 2;
}


/* =========================================================
   ANIMATE VALUE
========================================================= */

function animateValue(
  setter,
  duration
) {

  return new Promise(resolve => {

    const start =
      performance.now();

    function frame(now) {

      const raw =
        Math.min(
          1,
          (now - start) / duration
        );

      setter(
        easeInOutCubic(raw)
      );

      if (raw < 1) {

        requestAnimationFrame(frame);

      } else {

        resolve();

      }

    }

    requestAnimationFrame(frame);

  });

}


/* =========================================================
   RENDER PROJECT
========================================================= */

function render(first = false) {

  const state =
    states[current];

  experience.dataset.project =
    current;

  title.textContent =
    state.name.toUpperCase();

  nextName.textContent =
    state.next;

  nextNumber.textContent =
    state.number;

  portal.setAttribute(
    "aria-label",
    `Open ${state.next} project`
  );


  /* FACTS */

  facts.innerHTML = "";

  state.facts.forEach(
    ([key, value]) => {

      const row =
        document.createElement("div");

      row.className =
        "fact";

      const dt =
        document.createElement("dt");

      dt.textContent =
        key;

      const dd =
        document.createElement("dd");

      dd.textContent =
        value;

      row.appendChild(dt);

      row.appendChild(dd);

      facts.appendChild(row);

    }
  );


  /* PROJECT LIST */

  projectList.innerHTML = "";

  projects.forEach(name => {

    const item =
      document.createElement("span");

    item.className =
      "project-item";

    if (
      name.toLowerCase() === current
    ) {

      item.classList.add("active");

    }

    item.textContent =
      name;

    projectList.appendChild(item);

  });


  if (!first) {

    projectList.classList.remove(
      "is-switching"
    );

    void projectList.offsetWidth;

    projectList.classList.add(
      "is-switching"
    );

  }


  /* BACKGROUND */

  document
    .querySelectorAll(".background")
    .forEach(bg => {

      bg.classList.remove(
        "is-visible"
      );

    });

  const activeBackground =
    document.getElementById(
      state.background
    );

  if (activeBackground) {

    activeBackground.classList.add(
      "is-visible"
    );

  }


  /* PORTAL IMAGE */

  portalImage.src =
    state.portal;

}


/* =========================================================
   REVEAL MASK
========================================================= */

async function revealMask() {

  experience.classList.remove(
    "mask-revealing"
  );

  void experience.offsetWidth;

  experience.classList.add(
    "mask-revealing"
  );

  maskScale = 0;

  await animateValue(
    value => {
      maskScale = value;
    },
    1050
  );

}


/* =========================================================
   REVEAL CONTENT
========================================================= */

function revealPlanetContent() {

  experience.classList.remove(
    "content-revealing"
  );

  void experience.offsetWidth;

  experience.classList.add(
    "content-revealing"
  );

}


/* =========================================================
   PORTAL DRAW LOOP
========================================================= */

function draw(now) {

  const dt =
    Math.min(
      40,
      now - lastTime
    );

  lastTime = now;


  rotX +=
    (targetX - rotX) *
    Math.min(
      1,
      dt * .009
    );

  rotY +=
    (targetY - rotY) *
    Math.min(
      1,
      dt * .009
    );


  ctx.clearRect(
    0,
    0,
    window.innerWidth,
    window.innerHeight
  );


  const rect =
    portal.getBoundingClientRect();

  const rectCx =
    rect.left +
    rect.width / 2;

  const rectCy =
    rect.top +
    rect.height / 2;


  const e =
    expansion;

  const cx =
    rectCx +
    (
      window.innerWidth / 2 -
      rectCx
    ) * e;

  const cy =
    rectCy +
    (
      window.innerHeight / 2 -
      rectCy
    ) * e;


  const baseW =
    rect.width +
    (
      window.innerWidth -
      rect.width
    ) * e;

  const baseH =
    rect.height +
    (
      window.innerHeight -
      rect.height
    ) * e;


  const scale =
    e ? 1 : maskScale;

  const w =
    baseW * scale;

  const h =
    baseH * scale;


  const r =
    90 *
    (1 - e) *
    scale;


  const rx =
    rotX *
    (1 - e);

  const ry =
    rotY *
    (1 - e);


  if (w > 1 && h > 1) {

    const points =
      roundedRectPoints(
        w,
        h,
        r
      );


    const ax =
      rx * Math.PI / 180;

    const ay =
      ry * Math.PI / 180;


    ctx.save();

    ctx.globalAlpha =
      canvasOpacity;

    ctx.beginPath();


    points.forEach(
      (point, index) => {

        const xx =
          point.x *
          Math.cos(ay);

        const yy =
          point.y *
          Math.cos(ax);

        const z =
          point.x *
          Math.sin(ay) -
          point.y *
          Math.sin(ax);

        const p =
          850 /
          (850 + z);

        const sx =
          cx +
          xx * p;

        const sy =
          cy +
          yy * p;


        if (index === 0) {

          ctx.moveTo(
            sx,
            sy
          );

        } else {

          ctx.lineTo(
            sx,
            sy
          );

        }

      }
    );


    ctx.closePath();

    ctx.clip();


    ctx.fillStyle =
      "#080706";

    ctx.fillRect(
      0,
      0,
      window.innerWidth,
      window.innerHeight
    );


    drawCover(
      portalImage
    );


    drawShade();

    ctx.restore();

  }


  requestAnimationFrame(
    draw
  );

}


/* =========================================================
   POINTER TILT
========================================================= */

window.addEventListener(
  "pointermove",
  event => {

    if (busy) return;

    targetY =
      (
        event.clientX /
        window.innerWidth -
        .5
      ) * 37.4;

    targetX =
      (
        event.clientY /
        window.innerHeight -
        .5
      ) * -33;

  }
);


window.addEventListener(
  "pointerleave",
  () => {

    targetX = 0;

    targetY = 0;

  }
);


/* =========================================================
   TRAVEL
========================================================= */

async function travel() {

  if (busy) return;

  if (current === "villa") return;

  busy = true;

  targetX = 0;

  targetY = 0;


  const next =
    current === "residence"

      ? "commercial"

      : "villa";


  try {

    experience.classList.add(
      "is-transitioning"
    );


    await animateValue(
      value => {
        expansion = value;
      },
      1100
    );


    current =
      next;


    experience.classList.add(
      "is-committing"
    );


    render();


    await new Promise(
      resolve =>
        requestAnimationFrame(
          () =>
            requestAnimationFrame(
              resolve
            )
        )
    );


    experience.classList.remove(
      "is-transitioning"
    );

    experience.classList.remove(
      "is-committing"
    );


    expansion = 0;

    maskScale = 0;

    canvasOpacity = 1;


    const reveal =
      revealMask();


    setTimeout(
      () => {
        revealPlanetContent();
      },
      100
    );


    await reveal;


    setTimeout(
      () => {
        busy = false;
      },
      450
    );


  } catch (error) {

    console.error(error);

    expansion = 0;

    maskScale = 1;

    canvasOpacity = 1;

    experience.classList.remove(
      "is-transitioning",
      "is-committing"
    );

    busy = false;

  }

}


/* =========================================================
   PORTAL EVENTS
========================================================= */

portal.addEventListener(
  "click",
  travel
);


/* =========================================================
   CUSTOM CURSOR
========================================================= */

let mouseX = 0;

let mouseY = 0;

let cursorX = 0;

let cursorY = 0;


document.addEventListener(
  "pointermove",
  event => {

    mouseX =
      event.clientX;

    mouseY =
      event.clientY;

    cursor.classList.add(
      "is-visible"
    );

  }
);


document.addEventListener(
  "mouseleave",
  () => {

    cursor.classList.remove(
      "is-visible"
    );

  }
);


portal.addEventListener(
  "pointerenter",
  () => {

    cursor.classList.add(
      "is-enter"
    );

  }
);


portal.addEventListener(
  "pointerleave",
  () => {

    cursor.classList.remove(
      "is-enter"
    );

  }
);


function cursorLoop() {

  cursorX +=
    (mouseX - cursorX) *
    .2;

  cursorY +=
    (mouseY - cursorY) *
    .2;


  cursor.style.transform =
    `translate3d(${cursorX}px,${cursorY}px,0)`;


  requestAnimationFrame(
    cursorLoop
  );

}


/* =========================================================
   PRELOADER
========================================================= */

function runPreloader() {

  let value = 0;

  const start =
    performance.now();

  const duration =
    3000;


  function update(now) {

    const progress =
      Math.min(
        1,
        (now - start) /
        duration
      );


    value =
      Math.round(
        progress * 100
      );


    preloaderValue.textContent =
      value;


    if (progress < 1) {

      requestAnimationFrame(
        update
      );

    } else {

      finishPreloader();

    }

  }


  requestAnimationFrame(
    update
  );

}


let preloaderFinished =
  false;


function finishPreloader() {

  if (preloaderFinished) return;

  preloaderFinished = true;


  preloaderValue.textContent =
    "100";


  preloaderCount.classList.add(
    "is-leaving"
  );


  logo.classList.add(
    "is-docked"
  );


  preloader.classList.add(
    "is-background"
  );


  document.body.classList.add(
    "preload-complete"
  );


  setTimeout(
    () => {

      preloaderCount.remove();

    },
    750
  );


  setTimeout(
    () => {

      logo.classList.add(
        "is-settled"
      );

    },
    2000
  );


  startExperience();

}


/* =========================================================
   START EXPERIENCE
========================================================= */

async function startExperience() {

  experience.classList.add(
    "is-loading"
  );


  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        450
      )
  );


  experience.classList.remove(
    "is-loading"
  );


  await revealMask();


  document.body.classList.add(
    "intro-ready"
  );


  setTimeout(
    () => {

      revealPlanetContent();

    },
    850
  );

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================================================
   BOOT
========================================================= */

resizeCanvas();

render(true);

requestAnimationFrame(
  draw
);

requestAnimationFrame(
  cursorLoop
);

runPreloader();

</script>
